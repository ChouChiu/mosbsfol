[package]
name = "mosbsfol"
version = "0.1.0"
edition = "2021"
description = "MOSBSFOL - macOS Bull Shit Feature On Linux"
authors = ["ChouChiu"]
license = "Apache-2.0"
repository = "https://github.com/ChouChiu/mosbsfol"
homepage = "https://github.com/ChouChiu/mosbsfol"
documentation = "https://docs.rs/mosbsfol"

# Feature-driven build: every macOS behaviour can be compiled in/out.
[features]
default = ["dsstore", "appledouble", "maczip", "plist", "xattr", "volumetrace"]
dsstore = []
appledouble = []
maczip = ["appledouble", "dep:zip"]
plist = ["dep:base64"]
xattr = ["dep:xattr", "dep:uuid"]
volumetrace = ["dep:libc", "dep:uuid"]

# Mature, maintained crates are used for standard file formats and OS APIs
# so this project can focus on the macOS-specific behaviour itself.
[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
clap = "4"
libc = { version = "0.2", optional = true }
plist = { version = "1.10", default-features = false }
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["v4"], optional = true }
xattr = { version = "1.6", optional = true }
zip = { version = "4.6", default-features = false, features = [
    "time",
], optional = true }

[[bin]]
name = "mosbsfol"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
