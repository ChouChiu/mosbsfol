[package]
name = "mosbsfol"
version = "0.1.0"
edition = "2021"
description = "MOSBSFOL - macOS Bull Shit Feature On Linux"
authors = ["ChouChiu"]
license = "Apache-2.0"
repository = "https://github.com/ChouChiu/mosbsfol"
homepage = "https://github.com/ChouChiu/mosbsfol"
documentation = "https://docs.rs/mosbsfol"

# Feature-driven build: every macOS behaviour can be compiled in/out.
# Optional dependencies are declared with `dep:<crate>` so that a build
# with no features enabled only needs clap.
[features]
default = ["dsstore", "appledouble", "maczip", "plist", "xattr", "volumetrace"]
dsstore = ["dep:plist"]
appledouble = []
maczip = ["appledouble", "dep:zip"]
plist = ["dep:base64", "dep:plist"]
xattr = ["dep:xattr", "dep:uuid", "dep:plist"]
volumetrace = ["dep:uuid"]

# Mature, maintained crates are used for standard file formats and OS APIs
# so this project can focus on the macOS-specific behaviour itself.
[dependencies]
base64 = { version = "0.22", optional = true }
clap = { version = "4", default-features = false, features = [
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
plist = { version = "1.10", default-features = false, optional = true }
uuid = { version = "1", default-features = false, features = ["v4"], optional = true }
xattr = { version = "1.6", optional = true }
zip = { version = "4.6", default-features = false, features = [
    "time",
], optional = true }

[[bin]]
name = "mosbsfol"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
